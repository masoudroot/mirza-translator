<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup-body">
  <header class="popup-head">
    <img class="logo" src="icons/icon48.png" alt="">
    <div>
      <h1>مترجم میرزا <span class="ver" id="verBadge"></span></h1>
      <p class="tagline">متن همین صفحه را روان و ساده فارسی می‌کند؛ ساختار صفحه دست نمی‌خورد.</p>
    </div>
  </header>

  <div id="status" class="pill">…</div>

  <button id="translateBtn" class="btn btn-primary" type="button">ترجمه صفحه</button>

  <div class="card model-card" id="modelBox">
    <div class="model-current">
      <span class="model-label">مدل</span>
      <span class="model-name" id="currentModel">…</span>
      <button type="button" id="modelToggle" class="btn btn-ghost btn-small">تغییر مدل</button>
    </div>
    <div class="model-list-body" id="modelListBody" hidden>
      <input type="text" id="modelSearch" placeholder="جست‌وجوی مدل…" autocomplete="off">
      <ul id="modelItems" class="model-items"></ul>
      <div id="modelEmpty" class="hint" hidden>مدلی با این نام پیدا نشد.</div>
      <div class="row">
        <button type="button" id="modelRefresh" class="btn btn-ghost btn-small">به‌روزرسانی فهرست</button>
      </div>
      <div id="modelMsg" class="hint"></div>
    </div>
  </div>

  <div class="card update-card" id="updateBox">
    <div class="update-title">به‌روزرسانی</div>
    <div id="updateStatus">در حال بررسی به‌روزرسانی…</div>
    <button id="updateBtn" class="btn btn-gold" type="button" style="display:none;">به‌روزرسانی</button>
  </div>

  <a id="optionsLink" class="link">تنظیمات و کلید API</a>

  <div id="error"></div>
  <script src="popup.js"></script>
</body>
</html>
